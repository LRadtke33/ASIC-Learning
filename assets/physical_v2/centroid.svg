<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"><title>AABB and ABBA active units with dummy surroundings and their centroids</title><rect width="800" height="420" fill="white"/><g font-family="system-ui,sans-serif"><text x="400" y="28" font-size="17" fill="#33414f" text-anchor="middle" font-weight="bold">Linear-gradient cancellation depends on the active-unit centroids</text><text x="30" y="118" font-size="17" fill="#33414f" text-anchor="start" font-weight="bold">AABB</text><rect x="155" y="88" width="70" height="66" rx="4" fill="#c1ccd7" fill-opacity="1"/><text x="190" y="123" font-size="22" fill="#33414f" text-anchor="middle" font-weight="normal">D</text><text x="190" y="145" font-size="18" fill="#33414f" text-anchor="middle" font-weight="normal">↑</text><rect x="245" y="88" width="70" height="66" rx="4" fill="#2b6cb0" fill-opacity="1"/><text x="280" y="123" font-size="22" fill="white" text-anchor="middle" font-weight="normal">A</text><text x="280" y="145" font-size="18" fill="white" text-anchor="middle" font-weight="normal">↑</text><text x="280" y="175" font-size="12" fill="#33414f" text-anchor="middle" font-weight="normal">x = -3 µm</text><rect x="335" y="88" width="70" height="66" rx="4" fill="#2b6cb0" fill-opacity="1"/><text x="370" y="123" font-size="22" fill="white" text-anchor="middle" font-weight="normal">A</text><text x="370" y="145" font-size="18" fill="white" text-anchor="middle" font-weight="normal">↑</text><text x="370" y="175" font-size="12" fill="#33414f" text-anchor="middle" font-weight="normal">x = -1 µm</text><rect x="425" y="88" width="70" height="66" rx="4" fill="#a56830" fill-opacity="1"/><text x="460" y="123" font-size="22" fill="white" text-anchor="middle" font-weight="normal">B</text><text x="460" y="145" font-size="18" fill="white" text-anchor="middle" font-weight="normal">↑</text><text x="460" y="175" font-size="12" fill="#33414f" text-anchor="middle" font-weight="normal">x = 1 µm</text><rect x="515" y="88" width="70" height="66" rx="4" fill="#a56830" fill-opacity="1"/><text x="550" y="123" font-size="22" fill="white" text-anchor="middle" font-weight="normal">B</text><text x="550" y="145" font-size="18" fill="white" text-anchor="middle" font-weight="normal">↑</text><text x="550" y="175" font-size="12" fill="#33414f" text-anchor="middle" font-weight="normal">x = 3 µm</text><rect x="605" y="88" width="70" height="66" rx="4" fill="#c1ccd7" fill-opacity="1"/><text x="640" y="123" font-size="22" fill="#33414f" text-anchor="middle" font-weight="normal">D</text><text x="640" y="145" font-size="18" fill="#33414f" text-anchor="middle" font-weight="normal">↑</text><text x="325" y="58" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="normal">mean x(A) = −2 µm</text><text x="505" y="58" font-size="13" fill="#a56830" text-anchor="middle" font-weight="normal">mean x(B) = +2 µm</text><text x="30" y="273" font-size="17" fill="#33414f" text-anchor="start" font-weight="bold">ABBA</text><rect x="155" y="243" width="70" height="66" rx="4" fill="#c1ccd7" fill-opacity="1"/><text x="190" y="278" font-size="22" fill="#33414f" text-anchor="middle" font-weight="normal">D</text><text x="190" y="300" font-size="18" fill="#33414f" text-anchor="middle" font-weight="normal">↑</text><rect x="245" y="243" width="70" height="66" rx="4" fill="#2b6cb0" fill-opacity="1"/><text x="280" y="278" font-size="22" fill="white" text-anchor="middle" font-weight="normal">A</text><text x="280" y="300" font-size="18" fill="white" text-anchor="middle" font-weight="normal">↑</text><text x="280" y="330" font-size="12" fill="#33414f" text-anchor="middle" font-weight="normal">x = -3 µm</text><rect x="335" y="243" width="70" height="66" rx="4" fill="#a56830" fill-opacity="1"/><text x="370" y="278" font-size="22" fill="white" text-anchor="middle" font-weight="normal">B</text><text x="370" y="300" font-size="18" fill="white" text-anchor="middle" font-weight="normal">↑</text><text x="370" y="330" font-size="12" fill="#33414f" text-anchor="middle" font-weight="normal">x = -1 µm</text><rect x="425" y="243" width="70" height="66" rx="4" fill="#a56830" fill-opacity="1"/><text x="460" y="278" font-size="22" fill="white" text-anchor="middle" font-weight="normal">B</text><text x="460" y="300" font-size="18" fill="white" text-anchor="middle" font-weight="normal">↑</text><text x="460" y="330" font-size="12" fill="#33414f" text-anchor="middle" font-weight="normal">x = 1 µm</text><rect x="515" y="243" width="70" height="66" rx="4" fill="#2b6cb0" fill-opacity="1"/><text x="550" y="278" font-size="22" fill="white" text-anchor="middle" font-weight="normal">A</text><text x="550" y="300" font-size="18" fill="white" text-anchor="middle" font-weight="normal">↑</text><text x="550" y="330" font-size="12" fill="#33414f" text-anchor="middle" font-weight="normal">x = 3 µm</text><rect x="605" y="243" width="70" height="66" rx="4" fill="#c1ccd7" fill-opacity="1"/><text x="640" y="278" font-size="22" fill="#33414f" text-anchor="middle" font-weight="normal">D</text><text x="640" y="300" font-size="18" fill="#33414f" text-anchor="middle" font-weight="normal">↑</text><path d="M415 224 V313" fill="none" stroke="#33414f" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="415" cy="232" r="4" fill="#33414f"/><text x="415" y="213" font-size="13" fill="#33414f" text-anchor="middle" font-weight="normal">mean x(A) = mean x(B) = 0</text><text x="400" y="377" font-size="12" fill="#33414f" text-anchor="middle" font-weight="normal">D = dummy environment; arrows = common orientation. Not a legal device layout.</text><text x="400" y="400" font-size="12" fill="#33414f" text-anchor="middle" font-weight="normal">ABBA cancels a linear x gradient; unequal second moments still respond to curvature.</text></g></svg>