<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img"><title>Equal signal routes with switching and quiet upper-metal surroundings</title><rect width="800" height="400" fill="white"/><g font-family="system-ui,sans-serif"><text x="400" y="27" font-size="18" fill="#33414f" text-anchor="middle" font-weight="bold">Equal length does not guarantee equivalent loading</text><rect x="50" y="75" width="670" height="78" rx="4" fill="#dfe7ef" fill-opacity="0.65"/><path d="M80 114 H680" fill="none" stroke="#2b6cb0" stroke-width="6"/><circle cx="80" cy="114" r="4" fill="#33414f"/><circle cx="680" cy="114" r="4" fill="#33414f"/><text x="60" y="60" font-size="13" fill="#33414f" text-anchor="start" font-weight="normal">Route A: same layer, width, length and terminals</text><text x="80" y="148" font-size="12" fill="#33414f" text-anchor="middle" font-weight="normal">driver</text><text x="680" y="148" font-size="12" fill="#33414f" text-anchor="middle" font-weight="normal">receiver</text><rect x="50" y="220" width="670" height="78" rx="4" fill="#dfe7ef" fill-opacity="0.65"/><path d="M80 259 H680" fill="none" stroke="#2b6cb0" stroke-width="6"/><circle cx="80" cy="259" r="4" fill="#33414f"/><circle cx="680" cy="259" r="4" fill="#33414f"/><text x="60" y="205" font-size="13" fill="#33414f" text-anchor="start" font-weight="normal">Route B: same layer, width, length and terminals</text><text x="80" y="293" font-size="12" fill="#33414f" text-anchor="middle" font-weight="normal">driver</text><text x="680" y="293" font-size="12" fill="#33414f" text-anchor="middle" font-weight="normal">receiver</text><rect x="260" y="60" width="230" height="80" rx="4" fill="#a56830" fill-opacity="0.25"/><text x="375" y="82" font-size="12" fill="#a56830" text-anchor="middle" font-weight="normal">switching metal above A</text><text x="400" y="181" font-size="12" fill="#a56830" text-anchor="middle" font-weight="normal">A: mutual C to a switching net</text><rect x="260" y="205" width="230" height="80" rx="4" fill="#168166" fill-opacity="0.2"/><text x="375" y="227" font-size="12" fill="#168166" text-anchor="middle" font-weight="normal">quiet metal above B</text><text x="400" y="356" font-size="13" fill="#33414f" text-anchor="middle" font-weight="normal">A and B see different electrical neighbors even when their blue centerlines match.</text><text x="400" y="380" font-size="13" fill="#33414f" text-anchor="middle" font-weight="normal">Compare R, C to each reference, mutual C, vias, shielding returns and device contacts.</text></g></svg>