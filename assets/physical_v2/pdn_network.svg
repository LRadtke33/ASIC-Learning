<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img"><title>Three passive branches in parallel at a differential power port, driven by a test current</title><rect width="820" height="440" fill="white"/><g font-family="system-ui,sans-serif"><text x="410" y="27" font-size="18" fill="#33414f" text-anchor="middle" font-weight="bold">Example PDN seen at a local VDD–VSS port</text><text x="410" y="49" font-size="12" fill="#33414f" text-anchor="middle" font-weight="normal">All component values are teaching assumptions; the reference is an idealized common return.</text><path d="M90 90 H735 M90 355 H735" fill="none" stroke="#33414f" stroke-width="2"/><text x="45" y="95" font-size="13" fill="#33414f" text-anchor="start" font-weight="normal">VDD</text><text x="45" y="360" font-size="13" fill="#33414f" text-anchor="start" font-weight="normal">VSS</text><circle cx="140" cy="90" r="4" fill="#33414f"/><circle cx="140" cy="355" r="4" fill="#33414f"/><text x="140" y="78" font-size="13" fill="#33414f" text-anchor="middle" font-weight="bold">Feed</text><path d="M140 90 V120 M140 153 V183" fill="none" stroke="#33414f" stroke-width="2"/><rect x="127" y="120" width="26" height="33" rx="4" fill="#e9eff7" fill-opacity="1"/><path d="M127 120 h26 v33 h-26 Z" fill="none" stroke="#33414f" stroke-width="2"/><path d="M140 183 c-17 0 -17 16 0 16 c-17 0 -17 16 0 16 c-17 0 -17 16 0 16 c-17 0 -17 16 0 16" fill="none" stroke="#33414f" stroke-width="2"/><path d="M140 247 V355" fill="none" stroke="#33414f" stroke-width="2"/><text x="162" y="141" font-size="12" fill="#33414f" text-anchor="start" font-weight="normal">80 mΩ</text><text x="162" y="219" font-size="12" fill="#33414f" text-anchor="start" font-weight="normal">1 nH</text><text x="140" y="385" font-size="11" fill="#33414f" text-anchor="middle" font-weight="normal">Ideal regulator is AC shorted</text><circle cx="340" cy="90" r="4" fill="#33414f"/><circle cx="340" cy="355" r="4" fill="#33414f"/><text x="340" y="78" font-size="13" fill="#33414f" text-anchor="middle" font-weight="bold">Remote capacitor</text><path d="M340 90 V120 M340 153 V183" fill="none" stroke="#33414f" stroke-width="2"/><rect x="327" y="120" width="26" height="33" rx="4" fill="#e9eff7" fill-opacity="1"/><path d="M327 120 h26 v33 h-26 Z" fill="none" stroke="#33414f" stroke-width="2"/><path d="M340 183 c-17 0 -17 16 0 16 c-17 0 -17 16 0 16 c-17 0 -17 16 0 16 c-17 0 -17 16 0 16" fill="none" stroke="#33414f" stroke-width="2"/><path d="M340 247 V281 M323 281 h34 M323 292 h34 M340 292 V355" fill="none" stroke="#33414f" stroke-width="2"/><text x="362" y="141" font-size="12" fill="#33414f" text-anchor="start" font-weight="normal">20 mΩ</text><text x="362" y="219" font-size="12" fill="#33414f" text-anchor="start" font-weight="normal">1 nH</text><text x="365" y="292" font-size="12" fill="#33414f" text-anchor="start" font-weight="normal">100 nF</text><circle cx="540" cy="90" r="4" fill="#33414f"/><circle cx="540" cy="355" r="4" fill="#33414f"/><text x="540" y="78" font-size="13" fill="#33414f" text-anchor="middle" font-weight="bold">Local capacitor</text><path d="M540 90 V120 M540 153 V183" fill="none" stroke="#33414f" stroke-width="2"/><rect x="527" y="120" width="26" height="33" rx="4" fill="#e9eff7" fill-opacity="1"/><path d="M527 120 h26 v33 h-26 Z" fill="none" stroke="#33414f" stroke-width="2"/><path d="M540 183 c-17 0 -17 16 0 16 c-17 0 -17 16 0 16 c-17 0 -17 16 0 16 c-17 0 -17 16 0 16" fill="none" stroke="#33414f" stroke-width="2"/><path d="M540 247 V281 M523 281 h34 M523 292 h34 M540 292 V355" fill="none" stroke="#33414f" stroke-width="2"/><text x="562" y="141" font-size="12" fill="#33414f" text-anchor="start" font-weight="normal">20 mΩ</text><text x="562" y="219" font-size="12" fill="#33414f" text-anchor="start" font-weight="normal">20 pH</text><text x="565" y="292" font-size="12" fill="#33414f" text-anchor="start" font-weight="normal">1 nF</text><text x="540" y="385" font-size="11" fill="#33414f" text-anchor="middle" font-weight="normal">Damped case: ESR = 150 mΩ</text><path d="M715 90 V185 M715 255 V355" fill="none" stroke="#33414f" stroke-width="2"/><circle cx="715" cy="220" r="35" fill="white" stroke="#33414f" stroke-width="2"/><path d="M715 197 V244 M707 232 l8 12 8-12" fill="none" stroke="#33414f" stroke-width="2"/><text x="760" y="225" font-size="12" fill="#33414f" text-anchor="start" font-weight="normal">Iport</text><text x="410" y="418" font-size="12" fill="#33414f" text-anchor="middle" font-weight="normal">Zport = 1 / (1/Zfeed + 1/Zremote + 1/Zlocal); omitted branches contribute zero admittance.</text></g></svg>