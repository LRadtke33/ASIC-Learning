<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img"><title>A heat current source, thermal resistance and thermal capacitance form a first-order temperature model</title><rect width="800" height="400" fill="white"/><g font-family="system-ui,sans-serif"><text x="400" y="27" font-size="18" fill="#33414f" text-anchor="middle" font-weight="bold">One thermal state: heat flow charges a temperature state</text><text x="400" y="49" font-size="12" fill="#33414f" text-anchor="middle" font-weight="normal">A deliberately simple assumed lumped model, not a SKY130/package characterization.</text><path d="M130 100 H605 M130 305 H605 M130 100 V165 M130 235 V305" fill="none" stroke="#33414f" stroke-width="2"/><circle cx="130" cy="200" r="35" fill="white" stroke="#a56830" stroke-width="2"/><path d="M130 221 V178 M122 190 l8-12 8 12" fill="none" stroke="#a56830" stroke-width="2"/><text x="90" y="258" font-size="13" fill="#a56830" text-anchor="end" font-weight="normal">P = 0.2 W</text><circle cx="350" cy="100" r="4" fill="#33414f"/><circle cx="560" cy="100" r="4" fill="#33414f"/><text x="350" y="85" font-size="15" fill="#33414f" text-anchor="middle" font-weight="bold">θ = Tj − Tamb</text><path d="M350 100 V173 M350 233 V305" fill="none" stroke="#33414f" stroke-width="2"/><rect x="334" y="173" width="32" height="60" rx="4" fill="#e9eff7" fill-opacity="1"/><path d="M334 173 h32 v60 h-32 Z" fill="none" stroke="#33414f" stroke-width="2"/><text x="376" y="202" font-size="13" fill="#33414f" text-anchor="start" font-weight="normal">Rθ = 50 K/W</text><path d="M560 100 V194 M540 194 h40 M540 206 h40 M560 206 V305" fill="none" stroke="#33414f" stroke-width="2"/><text x="578" y="231" font-size="13" fill="#33414f" text-anchor="start" font-weight="normal">Cθ = 2 mJ/K</text><circle cx="350" cy="305" r="4" fill="#33414f"/><circle cx="560" cy="305" r="4" fill="#33414f"/><text x="350" y="331" font-size="13" fill="#33414f" text-anchor="middle" font-weight="normal">θ = 0: ambient-temperature reference</text><text x="400" y="371" font-size="14" fill="#33414f" text-anchor="middle" font-weight="normal">Cθ dθ/dt + θ/Rθ = P(t); time constant Rθ Cθ = 0.1 s.</text></g></svg>